[project]
name = "tari-extract"
version = "0.1.0"
description = "Detektor pose: video tari -> JSON tari-reference/0.1"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mediapipe==0.10.14",
  "opencv-python>=4.8,<4.11",
  "numpy<2",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
